name: CI

# main is dev's own history: CI fast-forwards it to a dev commit that passed, so nothing runs on it.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # One runner per operating system: macOS on arm64, Linux on x64.
        include:
          - { name: macOS arm64, runner: macos-latest, platform: darwin-arm64 }
          - { name: Linux x64, runner: ubuntu-latest, platform: linux-x64 }
    runs-on: ${{ matrix.runner }}
    # Every platform runs the same checks, and every job has to pass.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # The OpenCode and omp bundles of the generated harness/ are built with this Bun.
          bun-version-file: .bun-version

      - name: Bun runs natively on ${{ matrix.platform }}
        run: |
          got=$(bun -e 'process.stdout.write(process.platform + "-" + process.arch)')
          echo "bun $(bun --version) on $got"
          test "$got" = '${{ matrix.platform }}'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit -p .

      # harness/ is not committed: the generators run twice into temporary output roots, and the two trees must be
      # byte-identical with a manifest that lists exactly the files written. (A checkout has no harness/ to compare.)
      - name: Generation is deterministic
        run: |
          T=$(mktemp -d)
          HOME="$T" BURACLE_HOME="$T/.buracle" bun src/cli/main.ts build --check

      # The literal hook and MCP command lines the generators write for each harness are executed on this
      # operating system: the hook must deny a destructive command, and every buracle-memory entry must answer
      # initialize and tools/list and leave no process behind. The tests build harness/ into a temporary folder
      # first (tests/helpers/built-harness.ts). They also run again inside "Tests" below.
      - name: Generated hook and MCP commands run
        run: bun test tests/adapters/hook-wire.test.ts tests/adapters/mcp-wire.test.ts

      - name: Tests
        run: bun test

      - name: Install script parses
        run: bash -n scripts/install.sh

  # A clean macOS and Linux runner installs this commit (what main will hold) the way a
  # user does (scripts/install.sh, in a throwaway HOME), into the latest release of each harness,
  # then checks the installed buracle:
  # `buracle doctor` on the config, runtime and mcp topics (the mcp topic runs every server's handshake
  # through the installed shim). Nothing installs the system tools by hand: what the runner lacks, the install
  # downloads (pinned, sha256-checked); the runners' own Node.js, jq and Homebrew mean it rarely has to, so a step
  # of its own downloads and runs every pinned tool of the platform. The script never runs sudo or a package manager.
  posix-install:
    name: ${{ matrix.os }} install
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macOS, runner: macos-latest }
          - { os: Linux, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # scripts/install.sh finds this bun on PATH.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # main holds exactly this tree, with no harness/: the install builds it, as it does for any checkout.
      - name: This commit on a local branch
        run: |
          git switch -q -c release-tree
          test ! -e harness

      # Everything after this step runs in a home folder that holds nothing but what the install creates.
      - name: Throwaway HOME
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/home/.bun/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/home/.local/bin" >> "$GITHUB_PATH"

      # The latest release of each harness: a release that breaks Buracle Stack shows here before it reaches users.
      - name: Harnesses to install into
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex @opencode/cli
          bun add -g @oh-my-pi/pi-coding-agent

      # The download path the install takes for node, uv, rg and jq when no package manager can install them.
      - name: Pinned system tools download and run
        run: bun scripts/pin-system-tools.ts --verify

      # The install must end in one step: its output never tells the user to run `buracle install`, and a successful
      # install prints at most 40 lines (the details are in the install log, printed here when the install fails).
      - name: scripts/install.sh from this commit
        env:
          BURACLE_REPO: ${{ github.workspace }}
          BURACLE_BRANCH: release-tree
          BURACLE_CHECKOUT: ${{ runner.temp }}/buracle
        run: |
          out="$RUNNER_TEMP/install.out"
          set +e
          bash scripts/install.sh 2>&1 | tee "$out"
          code=${PIPESTATUS[0]}
          set -e
          lines=$(wc -l < "$out" | tr -d ' ')
          echo "install.sh exited $code and printed $lines lines"
          if [ "$code" != 0 ]; then cat "$HOME"/.buracle/logs/install-*.log || true; exit "$code"; fi
          if grep -n 'buracle install' "$out"; then echo 'the install output tells the user to run buracle install'; exit 1; fi
          if [ "$lines" -gt 40 ]; then echo 'a successful install printed more than 40 lines'; exit 1; fi

      - name: The installed buracle works
        run: |
          buracle --version
          for topic in config runtime mcp; do
            echo; echo "==> buracle doctor $topic"
            code=0
            buracle doctor "$topic" || code=$?
            echo "buracle doctor $topic exited $code"
            # 1 means errors; 2 means warnings, which the offline runners can have (an update check, for example)
            if [ "$code" = 1 ]; then echo "buracle doctor $topic reported errors"; exit 1; fi
          done

  # A push to dev that passes on every platform moves main to that commit. main is never rewritten and never gets a
  # commit of its own: the push must be a fast-forward, so main and dev share one history and one tree (harness/ is
  # built on the user's machine and is not committed anywhere). A GitHub release v<version> is cut when package.json
  # holds a version that has no tag yet, so raising the version there is the one way to publish a release.
  # The scripts clone main and `buracle update` follows it.
  release:
    name: Release
    needs: [checks, posix-install]
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fast-forward main and release a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$main" ]; then
            git push origin "$GITHUB_SHA:refs/heads/main"
          elif [ "$main" != "$GITHUB_SHA" ]; then
            git fetch -q origin main
            # A non-fast-forward push is refused: main has to be an ancestor of the tested commit.
            git merge-base --is-ancestor "$main" "$GITHUB_SHA" || { echo "main ($main) is not an ancestor of $GITHUB_SHA: it has diverged from dev"; exit 1; }
            git push origin "$GITHUB_SHA:refs/heads/main"
          fi
          version=$(jq -r .version package.json)
          if ! git ls-remote --exit-code --tags --refs origin "refs/tags/v$version" >/dev/null; then
            gh release create "v$version" scripts/install.sh --target "$GITHUB_SHA" --title "Buracle Stack $version" --generate-notes
          fi

  # Every push to dev that passes the checks builds the website from that commit and deploys it
  # (.github/workflows/pages.yml). A docs-only or site-only change goes out the same way.
  pages:
    name: Pages
    needs: checks
    if: github.event_name == 'push' && github.ref_name == 'dev'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
