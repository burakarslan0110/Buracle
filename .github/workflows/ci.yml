name: CI

# main holds only released files and has no test suite, so nothing runs on it.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

env:
  # What a release leaves out of the tested commit: the test suite and its Bun config.
  RELEASE_DROPS: tests bunfig.toml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # One runner per operating system: macOS on arm64, Linux and Windows on x64.
        include:
          - { name: macOS arm64, runner: macos-latest, platform: darwin-arm64 }
          - { name: Linux x64, runner: ubuntu-latest, platform: linux-x64 }
          - { name: Windows x64, runner: windows-latest, platform: win32-x64 }
    runs-on: ${{ matrix.runner }}
    # Every platform runs the same checks, and every job has to pass.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # The OpenCode and omp bundles in harness/ are built with this Bun; build --check needs the same one.
          bun-version-file: .bun-version

      - name: Bun runs natively on ${{ matrix.platform }}
        run: |
          got=$(bun -e 'process.stdout.write(process.platform + "-" + process.arch)')
          echo "bun $(bun --version) on $got"
          test "$got" = '${{ matrix.platform }}'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit -p .

      - name: Generated harness/ matches the source
        run: |
          T=$(mktemp -d)
          HOME="$T" BURACLE_HOME="$T/.buracle" bun src/cli/main.ts build --check

      # The literal hook and MCP command lines the generators write for each harness are executed on this
      # operating system: the hook must deny a destructive command, and every buracle-memory entry must answer
      # initialize and tools/list and leave no process behind. They also run again inside "Tests" below.
      - name: Generated hook and MCP commands run
        run: bun test tests/adapters/hook-wire.test.ts tests/adapters/mcp-wire.test.ts ${{ runner.os == 'Windows' && '--timeout 60000' || '' }}

      # Windows starts a process many times slower than macOS and Linux, and a test that spawns a few
      # takes 5 to 15 s there: past Bun's default 5 s per test, so Windows gets 60 s.
      - name: Tests
        run: bun test ${{ runner.os == 'Windows' && '--timeout 60000' || '' }}

      - name: Install scripts parse
        run: |
          bash -n scripts/install.sh
          pwsh -NoProfile -Command '$t = $null; $e = $null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$t, [ref]$e) | Out-Null; if ($e.Count) { $e | ForEach-Object { $_.ToString() }; exit 1 }'

  # A clean Windows runner installs the release tree (this commit without RELEASE_DROPS) the way a
  # user does (scripts/install.ps1), into all four harnesses at their tested versions, and uses it
  # once: every MCP server must answer its handshake.
  windows-install:
    name: Windows install
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: The release tree on a local branch
        shell: bash
        run: |
          git switch -q -c release-tree
          git rm -r -q --ignore-unmatch -- $RELEASE_DROPS
          git -c user.name=ci -c user.email=ci@localhost commit -q -m 'release tree'
          test ! -e tests

      - name: Harnesses to install into
        shell: pwsh
        run: npm install -g @anthropic-ai/claude-code@2.1.302 @openai/codex@0.162.1 @opencode/cli@2.0.30

      # The install must end in one step: its output never tells the user to run `buracle install`, and a successful
      # install prints at most 40 lines (the details are in the install log, printed here when the install fails).
      - name: scripts/install.ps1 from this commit
        shell: pwsh
        env:
          BURACLE_REPO: ${{ github.workspace }}
          BURACLE_BRANCH: release-tree
          BURACLE_CHECKOUT: ${{ runner.temp }}\buracle
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'install.out'
          pwsh -NoProfile -File ./scripts/install.ps1 *>&1 | Tee-Object -FilePath $out
          $code = $LASTEXITCODE
          $lines = @(Get-Content $out).Count
          Write-Host "install.ps1 exited $code and printed $lines lines"
          if ($code -ne 0) { Get-ChildItem (Join-Path $HOME '.buracle\logs') -Filter 'install-*.log' | Get-Content; exit $code }
          $hits = @(Select-String -Path $out -Pattern 'buracle install' -SimpleMatch)
          if ($hits.Count -gt 0) { $hits | ForEach-Object { $_.Line }; throw 'the install output tells the user to run buracle install' }
          if ($lines -gt 40) { throw 'a successful install printed more than 40 lines' }

      # GitHub's runner has winget, so the install above never downloads a tool; this checks the pinned downloads
      # (sha256, the .zip unpacked with tar.exe, the program run) with the product's own code.
      - name: Pinned system tools download and run
        shell: pwsh
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          bun scripts/pin-system-tools.ts --verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A user without administrator rights or Developer Mode cannot make a symbolic link, so every directory
      # link Buracle makes on Windows must be a junction.
      - name: Directory links are junctions
        shell: pwsh
        run: |
          $links = @(Get-ChildItem -Force -LiteralPath (Join-Path $HOME '.agents\skills') | Where-Object { $_.LinkType })
          if ($links.Count -eq 0) { throw 'no links in ~/.agents/skills' }
          $bad = @($links | Where-Object { $_.LinkType -ne 'Junction' })
          if ($bad.Count -gt 0) { $bad | ForEach-Object { "$($_.Name): $($_.LinkType)" }; throw 'directory links that are not junctions' }
          "$($links.Count) junctions in ~/.agents/skills"

      - name: Oh My Pi, installed after Bun
        shell: pwsh
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          bun add -g @oh-my-pi/pi-coding-agent@18.10.1
          buracle install omp --yes
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 2) { exit $LASTEXITCODE }
          exit 0

      - name: The installed buracle works
        shell: pwsh
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          buracle --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($topic in 'config', 'runtime', 'claude', 'codex', 'opencode', 'omp', 'mcp', 'lsp', 'tools', 'memory') {
            Write-Host "`n==> buracle doctor $topic"
            buracle doctor $topic
            $code = $LASTEXITCODE
            Write-Host "buracle doctor $topic exited $code"
            if ($code -eq 1) { throw "buracle doctor $topic reported errors" }
          }
          exit 0

  # The POSIX twin of windows-install: a clean macOS and Linux runner installs the release tree the way a
  # user does (scripts/install.sh, in a throwaway HOME), into the harnesses at their tested versions
  # (read from src/engine/update/tested-with.ts, not copied here), then checks the installed buracle:
  # `buracle doctor` on the config, runtime and mcp topics (the mcp topic runs every server's handshake
  # through the installed shim). Nothing installs the system tools by hand: what the runner lacks, the install
  # downloads (pinned, sha256-checked); the runners' own Node.js, jq and Homebrew mean it rarely has to, so a step
  # of its own downloads and runs every pinned tool of the platform. The script never runs sudo or a package manager.
  posix-install:
    name: ${{ matrix.os }} install
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macOS, runner: macos-latest }
          - { os: Linux, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # bun reads src/engine/update/tested-with.ts below; scripts/install.sh finds it on PATH.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: The release tree on a local branch
        run: |
          git switch -q -c release-tree
          git rm -r -q --ignore-unmatch -- $RELEASE_DROPS
          git -c user.name=ci -c user.email=ci@localhost commit -q -m 'release tree'
          test ! -e tests

      - name: Harness versions from tested-with.ts
        run: |
          bun -e 'import { TESTED_WITH as T } from "./src/engine/update/tested-with.ts"; console.log(`CLAUDE_VERSION=${T.claude.tested}\nCODEX_VERSION=${T.codex.tested}\nOPENCODE_VERSION=${T.opencode.tested}\nOMP_VERSION=${T.omp.tested}`)' | tee -a "$GITHUB_ENV"

      # Everything after this step runs in a home folder that holds nothing but what the install creates.
      - name: Throwaway HOME
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/home/.bun/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/home/.local/bin" >> "$GITHUB_PATH"

      - name: Harnesses to install into
        run: |
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_VERSION" "@openai/codex@$CODEX_VERSION" "@opencode/cli@$OPENCODE_VERSION"
          bun add -g "@oh-my-pi/pi-coding-agent@$OMP_VERSION"

      # The download path the install takes for node, uv, rg and jq when no package manager can install them.
      - name: Pinned system tools download and run
        run: bun scripts/pin-system-tools.ts --verify

      # The install must end in one step: its output never tells the user to run `buracle install`, and a successful
      # install prints at most 40 lines (the details are in the install log, printed here when the install fails).
      - name: scripts/install.sh from this commit
        env:
          BURACLE_REPO: ${{ github.workspace }}
          BURACLE_BRANCH: release-tree
          BURACLE_CHECKOUT: ${{ runner.temp }}/buracle
        run: |
          out="$RUNNER_TEMP/install.out"
          set +e
          bash scripts/install.sh 2>&1 | tee "$out"
          code=${PIPESTATUS[0]}
          set -e
          lines=$(wc -l < "$out" | tr -d ' ')
          echo "install.sh exited $code and printed $lines lines"
          if [ "$code" != 0 ]; then cat "$HOME"/.buracle/logs/install-*.log || true; exit "$code"; fi
          if grep -n 'buracle install' "$out"; then echo 'the install output tells the user to run buracle install'; exit 1; fi
          if [ "$lines" -gt 40 ]; then echo 'a successful install printed more than 40 lines'; exit 1; fi

      - name: The installed buracle works
        run: |
          buracle --version
          for topic in config runtime mcp; do
            echo; echo "==> buracle doctor $topic"
            code=0
            buracle doctor "$topic" || code=$?
            echo "buracle doctor $topic exited $code"
            # 1 means errors; 2 means warnings, which the offline runners can have (an update check, for example)
            if [ "$code" = 1 ]; then echo "buracle doctor $topic reported errors"; exit 1; fi
          done

  # A push to dev that passes on every platform publishes a release when the released files change.
  # The release tree is the tested commit at the release's version, rebuilt (harness/ carries the
  # version), without RELEASE_DROPS. main gets it as one commit per release (the first has no
  # parent), and v<version> points at that commit with both install scripts attached. The version
  # counts up by itself: the next patch after the newest v<major.minor>.* tag, or package.json's
  # version when its line has no release yet, so raising major or minor there starts a new line.
  # The scripts clone main and `buracle update` follows it, so an install holds the released files.
  release:
    name: Release
    needs: [checks, windows-install, posix-install]
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish main and the next version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(jq -r .version package.json)
          # The tree of this commit at version $1, rebuilt, without RELEASE_DROPS.
          release_tree() (
            set -e
            git reset -q --hard "$GITHUB_SHA"
            V="$1" bun -e 'const f = "package.json"; const t = await Bun.file(f).text(); await Bun.write(f, t.replace(/("version":\s*")[^"]*(")/, `$1${process.env.V}$2`))'
            T=$(mktemp -d)
            HOME="$T" BURACLE_HOME="$T/.buracle" bun src/cli/main.ts build >/dev/null
            export GIT_INDEX_FILE="$RUNNER_TEMP/release.index"
            rm -f "$GIT_INDEX_FILE"
            git read-tree HEAD
            git add -A
            git rm -r -q --cached --ignore-unmatch -- $RELEASE_DROPS
            git write-tree
          )
          parent=$(git ls-remote origin refs/heads/main | cut -f1)
          [ -z "$parent" ] || git fetch -q origin main
          # A version in package.json that has no release yet was raised by hand and is released as it is.
          # Otherwise nothing is released while main already holds this commit's files.
          if [ -n "$parent" ] && git ls-remote --exit-code --tags --refs origin "refs/tags/v$base" >/dev/null; then
            current=$(git show "$parent:package.json" | jq -r .version)
            candidate=$(release_tree "$current")
            if [ "$candidate" = "$(git rev-parse "$parent^{tree}")" ]; then
              echo "main already holds these files as $current"
              exit 0
            fi
          fi
          line=${base%.*}
          last=$(git ls-remote --tags --refs origin "refs/tags/v$line.*" | sed "s|.*refs/tags/v$line\.||" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -n "$last" ] && [ "$last" -ge "${base##*.}" ]; then version="$line.$((last + 1))"; else version=$base; fi
          tree=$(release_tree "$version")
          if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then
            commit=$parent
          else
            # The release commit carries the author of the tested commit.
            export GIT_AUTHOR_NAME="$(git log -1 --format=%an "$GITHUB_SHA")" GIT_AUTHOR_EMAIL="$(git log -1 --format=%ae "$GITHUB_SHA")"
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            if [ -n "$parent" ]; then
              commit=$(git commit-tree "$tree" -p "$parent" -m "Buracle $version")
            else
              commit=$(git commit-tree "$tree" -m "Initial release: Buracle $version")
            fi
            git push origin "$commit:refs/heads/main"
          fi
          gh release view "v$version" >/dev/null 2>&1 || gh release create "v$version" scripts/install.sh scripts/install.ps1 \
            --target "$commit" --title "Buracle $version" --generate-notes
