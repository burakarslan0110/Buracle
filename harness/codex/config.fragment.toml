# Buracle-managed parts of ~/.codex/config.toml (generated by `buracle build` from the default
# config). `buracle install` merges them into the live config: each [mcp_servers.<id>] and
# [tools.update_plan] as a table, the [tui] keys and the root keys below one by one. Every other
# key, table and comment stays. A value you changed is kept, except the no-approval keys while
# permissions.enforce is on; the reasoning-effort keys follow config effort.codex and keep a level
# you (or a Codex model migration) set. {buracle} is replaced with the absolute path of the
# Buracle shim. Secrets are forwarded with env_vars, never written.

# Routing: MCP tools on the first turn; the built-in web search is off while routing is enforced.
mcp_optional_startup_grace_ms = 0
web_search = "disabled"
# Default reasoning effort (config effort.codex).
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
agents.default_subagent_reasoning_effort = "xhigh"
# agents.teams: Codex agent threads (spawn_agent, wait_agent) stay on; a value you set is kept.
agents.enabled = true
# Codex native memories stay off: the Buracle brain is the one memory; a value you set is kept.
features.memories = false
# The summary prompt of local compaction (providers Codex does not compact remotely); a value you set is kept.
compact_prompt = "Compact this conversation into a handoff summary so that another agent can continue the work in a fresh context. That agent sees only your summary, the files on disk and its tools; it has not seen this conversation.\n\nWrite short Markdown sections: the goal and what the user asked for; what is done; what is in progress and the exact next step; what is still open, unanswered questions to the user included.\n\nBuracle — keep through compaction:\n- Keep the user's requests and corrections in their own words and language, and every decision with its reason.\n- Keep the approaches that were tried and rejected, each with why it failed, so they are not tried again.\n- Keep the verification commands that ran and their results (pass or fail, with the key output lines), and the commands that failed with their key error lines.\n- Keep the paths of the files changed and what changed in each.\n- Keep the open todo items. Drop tool output that has already been acted on, but never an unanswered question or an unfinished step.\n- If a plan file is active (under docs/plans/ or docs/builds/), keep its path verbatim and which task is in progress; the file holds the real progress and is re-read after compaction."
# permissions.bypass: Codex asks nothing except the H20 consent prompts of Buracle's execpolicy rule; every other approval is rejected or answered by Buracle's hooks (both keys or neither).
approval_policy = { granular = { sandbox_approval = false, rules = true, skill_approval = false, request_permissions = false, mcp_elicitations = false } }
sandbox_mode = "danger-full-access"

[mcp_servers.buracle-memory]
command = "{buracle}"
args = ["mcp", "memory"]
omit_tools_from = ["deferred", "code_mode"]
default_tools_approval_mode = "approve"

[mcp_servers.chrome-devtools]
command = "{buracle}"
args = ["mcp", "run", "chrome-devtools"]
startup_timeout_sec = 30
default_tools_approval_mode = "approve"

[mcp_servers.codegraph]
command = "{buracle}"
args = ["mcp", "run", "codegraph"]
env = { CODEGRAPH_MCP_TOOLS = "explore,search,node,callers,callees,impact,status,files", CODEGRAPH_NO_UPDATE_CHECK = "1", CODEGRAPH_TELEMETRY = "0" }
startup_timeout_sec = 30
omit_tools_from = ["deferred", "code_mode"]
default_tools_approval_mode = "approve"

[mcp_servers.context-mode]
command = "{buracle}"
args = ["mcp", "run", "context-mode"]
env = { CONTEXT_MODE_PLATFORM = "codex" }
startup_timeout_sec = 30
tool_timeout_sec = 600
enabled_tools = ["ctx_execute", "ctx_execute_file", "ctx_batch_execute", "ctx_index", "ctx_search", "ctx_fetch_and_index", "ctx_stats", "ctx_purge"]
disabled_tools = ["ctx_upgrade", "ctx_insight", "ctx_doctor"]
omit_tools_from = ["deferred", "code_mode"]
default_tools_approval_mode = "approve"

[mcp_servers.context7]
command = "{buracle}"
args = ["mcp", "run", "context7"]
startup_timeout_sec = 30
omit_tools_from = ["deferred", "code_mode"]
default_tools_approval_mode = "approve"

[mcp_servers.grep]
url = "https://mcp.grep.app"
default_tools_approval_mode = "approve"

[mcp_servers.lsp]
command = "{buracle}"
args = ["lsp", "mcp"]
env_vars = ["CARGO_HOME", "DOTNET_ROOT", "GOPATH", "GOROOT", "JAVA_HOME", "RUSTUP_HOME"]
omit_tools_from = ["deferred", "code_mode"]
default_tools_approval_mode = "approve"

[mcp_servers.semble]
command = "{buracle}"
args = ["mcp", "run", "semble"]
env = { HF_HUB_DISABLE_TELEMETRY = "1" }
startup_timeout_sec = 30
omit_tools_from = ["deferred", "code_mode"]
default_tools_approval_mode = "approve"

[mcp_servers.web-fetch]
command = "{buracle}"
args = ["mcp", "run", "web-fetch"]
startup_timeout_sec = 30
tool_timeout_sec = 180
omit_tools_from = ["deferred", "code_mode"]
default_tools_approval_mode = "approve"

[mcp_servers.web-search]
command = "{buracle}"
args = ["mcp", "run", "web-search"]
env = { DEFAULT_SEARCH_ENGINE = "duckduckgo", MODE = "stdio" }
startup_timeout_sec = 30
omit_tools_from = ["deferred", "code_mode"]
default_tools_approval_mode = "approve"

[tui]
status_line = ["model-with-reasoning", "context-used", "five-hour-limit", "weekly-limit", "git-branch", "branch-changes", "task-progress", "run-state"]
terminal_title = ["activity", "project-name", "git-branch", "context-used", "five-hour-limit", "weekly-limit"]

[tools.update_plan]
enabled = true
