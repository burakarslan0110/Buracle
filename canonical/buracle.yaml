version: 1

harnesses:
  claude: { enabled: true }
  codex: { enabled: true }
  opencode: { enabled: true }
  omp: { enabled: true }

routing:
  strictness: enforce
  skills: router
  reminders: true

guards:
  bash:
    extraDeny: []
  write:
    protect: []
  redact: true

plan:
  stopGuard: true
  planApproval: true
  resultApproval: true
  branchIsolation: true
  questions: true
  reviews:
    plan: true
    changes: true
    goal: true
    companion: "off"
  goalVerification: true
  modelSwitch: "off"
  nativePlanMode: "off"

checkers:
  enabled: true
  languages: [python, typescript, javascript, go, shell, dotnet]

memory:
  ui:
    autostart: true
  exclude: []

statusline:
  style: buracle
  emoji: true

skills:
  sources:
    - name: buracle
      path: canonical/skills

update:
  minReleaseAgeDays: 0

permissions:
  bypass: true
  enforce: true

agents:
  teams: true

workflow:
  band: true
  codexNotices: true

toolchain:
  autoInstall: true
  system: true
  upgrade: true

index:
  exclude: []

mcp:
  shared: true
  off:
    claude: []
    codex: []
    opencode: []
    omp: []
