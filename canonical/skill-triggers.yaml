      en:
        - open the page
        - take a screenshot
        - screenshot of
        - console errors
        - browser console
        - network tab
        - lighthouse
        - devtools
        - "re:\\b(?:open|test|check|verify|look|see|load|reproduce|try|view|inspect|debug|click|watch|preview)\\w*\\b.{0,40}\\bin the browser\\b"
      tr:
        - ekran goruntusu
        - konsol hata*
        - sayfayi ac*
        - "re:\\btarayicida\\b.{0,30}\\b(?:ac|test et|kontrol et|dene|bak|gor|incele)\\w*"

  memory:
    topic:
      en: [memory note*, vault note*, the memory vault, the memory brain]
      tr: [hafiza not*, hafiza kayd*, kasa not*]
