version: 1

# Phrase triggers for skills were removed (PRD follow-up 2026-11-06): a skill loads from an exact
# invocation only, and the agent picks skills from their descriptions. The categories below route
# a prompt to the MCP server built for it.
categories:
  library-docs:
    topic:
      en:
        - official docs
        - official documentation
        - library docs
        - framework docs
        - according to the docs
        - per the docs
        - from the docs
        - verify in the docs
        - api reference
        - api docs
        - migration guide
        - upgrade guide
        - "re:\\bcheck the docs\\b(?!/|\\s+(?:folder|directory|dir)\\b)"
        - "re:\\b(?:look|looked|looking|search|searched|searching)\\b(?:\\s+(?:it|this|that|them)\\s+up)?\\s+in the docs\\b(?!/|\\s+(?:folder|directory|dir)\\b)"
        - "re:\\b(?:says?|said|mentioned|documented|described)\\s+in the docs\\b"
        - "re:\\b(?!(?:the|our|my|your|their|this|that|an?|its|new|own|same|internal|custom|official|public|private|client|server|web|mobile)\\b)[a-z][a-z0-9.-]{2,}\\s+sdk\\b"
      tr:
        - belgelerden
        - belgelere gore
        - resmi belge*
        - dokumantasyondan
        - dokumantasyona gore
        - api referans*
        - goc rehberi
        - "re:\\b(?:belgelerde|dokumantasyonda)\\b(?!.{0,40}\\b(?:ekle|guncelle|duzelt|kaldir|sil)\\w*)"
    not:
      en: [docs folder, docs directory]
      tr: [docs klasor*]
    deps:
      en: [api, apis, config, configure, configuration, option*, migrat*, upgrade*, version*, deprecat*, breaking change*, hook*, middleware, plugin*, setup, set up, install*, usage, how to use, how to, how do, how does, how can, why does, why do, why is, what does, what options, which options, by default, syntax, integrat*, method*, signature, type*, "re:\\bv\\d+(?:\\.\\d+)*\\b", "re:\\b\\d+\\.\\d+(?:\\.\\d+)?\\b"]
      tr: [nasil, yapilandir*, ayar*, surum*, guncelle*, kurulum*, entegre*, goc*, tip*]

  code-structure:
    topic:
      en:
        - who calls
        - what calls
        - callers of
        - call sites
        - call graph
        - find usages
        - all usages
        - references to
        - impact of chang*
        - blast radius
        - what breaks if
        - what depends on
        - "re:\\bwhere (?:is|are) \\S+ (?:called|used|invoked|referenced)"
      tr: [nereden cagriliyor, nerelerde cagriliyor, kim cagiriyor, cagiranlar*, cagri grafi*, nerelerde kullaniliyor, etki analizi, neyi bozar, neler etkilenir]

  language-server:
    topic:
      en:
        - type error*
        - typecheck error*
        - type-check error*
        - compile error*
        - compiler error*
        - compilation error*
        - lsp diagnostics
        - language server
        - go to definition
        - jump to definition
        - "re:\\bwhat(?:'s| is) the type of\\b"
      tr: [tip hata*, derleme hata*, tanima git, tanimina git]

  code-search:
    topic:
      en:
        - which file
        - find the code that
        - find where
        - locate the code
        - "re:\\bwhere (?:is|are|do we|does) (?:the |our |we )?\\S+ (?:defined|implemented|handled|configured|loaded|set|parsed|created)"
        - "re:\\bhow (?:does|do) .{1,60}\\bwork\\b"
      tr: [nerede tanimli, nerede yapiliyor, nerede uygulan*, hangi dosyada, nasil calisiyor, kodu bul]
    not:
      en: [where were we, where did we leave]
      tr: [nerede kalmistik, nerede kaldik]

  web-search:
    topic:
      en:
        - latest version
        - latest release
        - latest stable
        - release notes
        - "what's new in"
        - whats new in
        - still maintained
        - search the web
        - look it up online
        - "re:\\b(?:read|check|see|look at|according to|per)\\s+(?:the\\s+|its\\s+|their\\s+)?(?:upstream\\s+|official\\s+)?changelog\\b"
        - "re:\\bchangelog\\s+(?:of|for)\\b"
        - "re:\\b(?:is|was)\\s+(?:this|it|that|there)\\s+a\\s+known\\s+(?:issue|bug)\\b"
        - "re:\\b(?:any|are there)\\s+known\\s+(?:issues?|bugs?)\\b"
        - "re:\\bknown\\s+(?:issues?|bugs?)\\s+(?:with|in|of)\\s+(?!(?:our|my|this|the)\\b)"
      tr: [son surum*, guncel surum*, en son surum*, surum notlari, degisiklik gunlugu, hala bakimi yapiliyor, webde ara*, internette ara*]
    not:
      en: [draft* release notes, write* release notes, generate* release notes, release notes from, our release notes, our changelog, update the changelog, changelog entry]
      tr: [surum notlari yaz*, surum notlarini yaz*, surum notlari hazirla*, degisiklik gunlugunu guncelle*]

  code-examples:
    topic:
      en: [examples on github, github examples, real-world usage, real world usage, real-world examples, how do other projects, how others use, open-source examples, open source examples]
      tr: ["github'da*", gercek projelerde, acik kaynak projelerde, ornek kullanim*, baska projeler nasil]

  browser:
